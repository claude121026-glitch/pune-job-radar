name: Crawl Pune jobs and companies

on:
  schedule:
    - cron: "17 */2 * * *"   # jobs every 2 hours, around the clock
    - cron: "40 2 1 * *"     # company registry refresh on the 1st of each month
  workflow_dispatch:
    inputs:
      import_registry:
        description: "Re-import the company registry now"
        type: boolean
        default: false
      enrich_limit:
        description: "How many companies to check for contact details"
        default: "300"
      enrich_sizes:
        description: "Only these sizes, e.g. large,mid,small (blank = all)"
        default: ""

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      DATA_GOV_API_KEY: ${{ secrets.DATA_GOV_API_KEY }}
      ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
      ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
      JOOBLE_API_KEY: ${{ secrets.JOOBLE_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      KEYWORDS: ${{ vars.KEYWORDS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Crawl jobs
        run: python crawler.py
      - name: Import company registry
        if: ${{ env.DATA_GOV_API_KEY != '' && (github.event.schedule == '40 2 1 * *' || inputs.import_registry || hashFiles('data/companies.sqlite') == '') }}
        run: python directory.py import-api
      - name: Find contact details (300 more companies per scheduled run)
        env:
          LIMIT: ${{ inputs.enrich_limit || '300' }}
          SIZES: ${{ inputs.enrich_sizes || '' }}
        run: |
          if [ -f data/companies.sqlite ]; then
            if [ -n "$SIZES" ]; then python directory.py enrich "$LIMIT" --sizes "$SIZES"; else python directory.py enrich "$LIMIT"; fi
            python directory.py about 1500
            python directory.py job-contacts
            python directory.py build
          fi
      - name: Save results
        run: |
          git config user.name "job-crawler"
          git config user.email "job-crawler@users.noreply.github.com"
          git add web/jobs.json
          if [ -f data/companies.sqlite ]; then git add data/companies.sqlite web/companies.json web/pune-companies-with-contacts.csv web/job-contacts.json; fi
          git diff --cached --quiet || git commit -m "crawl $(date -u +%FT%TZ)"
          git pull --rebase -X theirs || true
          git push
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

  # a separate job, so the uploaded site is fully registered before it is deployed
  deploy:
    needs: crawl
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
