name: Crawl Pune and Mumbai jobs and companies

on:
  schedule:
    - cron: "17 */2 * * *"   # jobs every 2 hours, around the clock
    - cron: "40 2 1 * *"     # company registry refresh on the 1st of each month
  workflow_dispatch:
    inputs:
      import_registry:
        description: "Re-import the company registry now"
        type: boolean
        default: false
      enrich_limit:
        description: "How many companies to check for contact details"
        default: "300"
      enrich_sizes:
        description: "Only these sizes, e.g. large,mid,small (blank = all)"
        default: ""
      enrich_minutes:
        description: "Stop checking after this many minutes (blank = no limit); progress is saved as it goes"
        default: ""

permissions:
  contents: write
  actions: write   # lets a long batch start the next one
  pages: write
  id-token: write

concurrency:
  group: crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    env:
      DATA_GOV_API_KEY: ${{ secrets.DATA_GOV_API_KEY }}
      ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
      ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
      JOOBLE_API_KEY: ${{ secrets.JOOBLE_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      KEYWORDS: ${{ vars.KEYWORDS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Crawl jobs
        run: python crawler.py
      - name: Import company registry (Pune and Mumbai)
        if: ${{ env.DATA_GOV_API_KEY != '' && (github.event.schedule == '40 2 1 * *' || inputs.import_registry || hashFiles('data/companies.sqlite') == '' || hashFiles('data/companies-mumbai.sqlite') == '') }}
        run: python directory.py import-api
      - name: Find contact details (300 more companies per city per scheduled run)
        env:
          LIMIT: ${{ inputs.enrich_limit || '300' }}
          SIZES: ${{ inputs.enrich_sizes || '' }}
          MINUTES: ${{ inputs.enrich_minutes || '' }}
        run: |
          echo "UNCHECKED_BEFORE=$(python directory.py unchecked all)" >> "$GITHUB_ENV"
          start=$(date +%s)
          for city in pune mumbai; do
            db=data/companies.sqlite; [ "$city" = mumbai ] && db=data/companies-mumbai.sqlite
            [ -f "$db" ] || continue
            args="$LIMIT"
            if [ -n "$SIZES" ]; then args="$args --sizes $SIZES"; fi
            if [ -n "$MINUTES" ]; then
              # long batches share one time budget across the cities
              left=$(( MINUTES - ( $(date +%s) - start ) / 60 ))
              if [ "$left" -lt 2 ]; then left=1; fi
              args="$args --minutes $left"
            fi
            echo "== $city"
            python directory.py --city $city enrich $args
            python directory.py --city $city about 1500
            python directory.py --city $city job-contacts
            python directory.py --city $city build
          done
      - name: Save results
        run: |
          git config user.name "job-crawler"
          git config user.email "job-crawler@users.noreply.github.com"
          git add web/jobs.json web/job-details.json
          if [ -f data/companies.sqlite ]; then git add data/companies.sqlite web/companies.json web/pune-companies-with-contacts.csv web/job-contacts.json; fi
          if [ -f data/companies-mumbai.sqlite ]; then git add data/companies-mumbai.sqlite web/companies-mumbai.json web/mumbai-companies-with-contacts.csv web/job-contacts-mumbai.json; fi
          git diff --cached --quiet || git commit -m "crawl $(date -u +%FT%TZ)"
          git pull --rebase -X theirs || true
          git push
      - name: Start the next batch (long runs only, until every company is checked)
        if: ${{ inputs.enrich_minutes != '' && inputs.enrich_minutes != null }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          left=$(python directory.py unchecked all)
          echo "unchecked before: $UNCHECKED_BEFORE, after: $left"
          if [ "$left" -gt 0 ] && [ "$left" -lt "${UNCHECKED_BEFORE:-0}" ]; then
            gh workflow run crawl.yml --ref main -f enrich_limit="${{ inputs.enrich_limit }}" -f enrich_minutes="${{ inputs.enrich_minutes }}"
            echo "started the next batch ($left companies left)"
          else
            echo "no next batch: all checked, or this run made no progress"
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

  # a separate job, so the uploaded site is fully registered before it is deployed
  deploy:
    needs: crawl
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
